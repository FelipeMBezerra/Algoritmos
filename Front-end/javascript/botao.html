<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="botao.js"></script>
    <title>Formulario com js</title>
</head>
<body id="corpo">
    <form action="" id="form">
        <fieldset>
            <legend>Meu tipos input</legend>
            <label for="text">Nome:</label>
            <input id="nome" name="name" type="text" required placeholder="Seu nome">
            <br>
            <br>
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" required placeholder="Digite seu email">
            <br>
            <br>
            <label for="password">Senha:</label>
            <input id="senha" type="password" name="password" minlength="6" required placeholder="Digite sua senha">
            <br>
            <br>
            <button>Enviar</button>

        </fieldset>
    </form>


    <button id="clique-em">Clique aqui!</button>
</body>

</html>
